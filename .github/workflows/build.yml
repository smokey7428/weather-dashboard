name: Build

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  web:
    name: Web app tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Allow-list consistency (CSP vs app vs service worker)
        run: npm run test:consistency

      - name: Offline city lookup tests
        run: npm run test:cities

      - name: Page tests (privacy, CSP, layout)
        run: npm run test:page

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Check for signing secrets
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Signing secrets are not configured, so the APK build is skipped. See android/README.md."
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              echo "::error::Refusing to tag a release: ANDROID_KEYSTORE_BASE64 is not set."
              echo "Generate a key with android/tools/make-keystore.sh, then add these secrets:"
              echo "  ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD"
              exit 1
            fi
          fi

      # The runner image already has the SDK, so this only selects it and adds
      # the components the build needs. Deliberately not using a third-party
      # setup action: android-actions/setup-android@v3 currently fails because it
      # tries to install the long-removed 'tools' package, and this project
      # prefers to depend on as little third-party code as possible.
      - name: Set up Android SDK
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK" ]; then
            echo "::error::no Android SDK at $SDK"
            exit 1
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          SDKMANAGER=$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -1)
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found under $SDK"
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

      - name: Write signing config
        if: steps.signing.outputs.ready == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p android/keystore
          echo "$KEYSTORE_BASE64" | base64 -d > android/keystore/weatherdashboard.jks
          {
            echo "storeFile=keystore/weatherdashboard.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/keystore.properties
          chmod 600 android/keystore/weatherdashboard.jks android/keystore.properties

      - name: Build release APK
        if: steps.signing.outputs.ready == 'true'
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Fail if the app asks for unexpected permissions
        if: steps.signing.outputs.ready == 'true'
        run: |
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          APK=android/app/build/outputs/apk/release/app-release.apk
          PERMS=$("$BUILD_TOOLS/aapt2" dump badging "$APK" \
            | grep "^uses-permission:" | sed "s/uses-permission: name='//;s/'//" | sort)
          echo "$PERMS"
          # INTERNET and the two location permissions are declared in the
          # manifest. DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION is injected by
          # androidx.core: it is signature-level, scoped to this app's own
          # applicationId, grants nothing to any other app, and protects
          # dynamically registered broadcast receivers. It is listed explicitly
          # so that any *additional* permission still fails the build.
          EXPECTED=$(printf '%s\n' \
            android.permission.ACCESS_COARSE_LOCATION \
            android.permission.ACCESS_FINE_LOCATION \
            android.permission.INTERNET \
            com.smokey7428.weatherdashboard.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION | sort)
          if [ "$PERMS" != "$EXPECTED" ]; then
            echo "::error::Permission set changed. Review the diff above."
            exit 1
          fi

      - name: Report permissions and signature
        if: steps.signing.outputs.ready == 'true'
        run: |
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          APK=android/app/build/outputs/apk/release/app-release.apk
          {
            echo "### APK"
            echo '```'
            "$BUILD_TOOLS/aapt2" dump badging "$APK" \
              | grep -E "^package:|^launchable-activity:|^uses-permission:" || true
            echo '```'
            echo "### Signing certificate"
            echo '```'
            "$BUILD_TOOLS/apksigner" verify --print-certs "$APK" \
              | grep -E "Signer #1 certificate (DN|SHA-256)" || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: steps.signing.outputs.ready == 'true'
        with:
          name: weather-dashboard-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Attach APK to release
        if: steps.signing.outputs.ready == 'true' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: android/app/build/outputs/apk/release/*.apk
          body: |
            Weather Dashboard for Android.

            ## ⚠️ Vibe coded — install and use at your own risk

            This app was written by an AI coding agent from plain-English prompts.
            It has had **no security audit, no penetration test and no independent
            review**, and comes from a **self-signed key that no app store vets**.
            It requests only three permissions and a lot of care went into its
            privacy design, but *trying* to be safe is not *proof* of being safe.
            There is **no warranty of any kind**.

            Only install an APK from outside a store if you accept that risk.

            ### Verifying the download

            Installing it is a one-time "allow from this source" prompt — normal
            for any app that does not come from a store.

            Compare the signing certificate below with the one published by
            whoever sent you the app:

            ```
            $ apksigner verify --print-certs weather-dashboard.apk
            ```

            If the SHA-256 fingerprint does not match, do not install it.
