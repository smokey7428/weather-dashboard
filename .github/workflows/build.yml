name: Build

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  web:
    name: Web app tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Allow-list consistency (CSP vs app vs service worker)
        run: npm run test:consistency

      - name: Offline city lookup tests
        run: npm run test:cities

      - name: Page tests (privacy, CSP, layout)
        run: npm run test:page

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # A signed APK needs the signing key. Without it the build is skipped on
      # ordinary pushes (so CI stays green until the secrets exist), but a v*
      # tag is a deliberate release attempt and must not pass silently.
      - name: Check for signing secrets
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Signing secrets are not configured, so the APK build is skipped. See android/README.md."
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              echo "::error::Refusing to tag a release: ANDROID_KEYSTORE_BASE64 is not set."
              echo "Generate a key with android/tools/make-keystore.sh, then add these secrets:"
              echo "  ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD"
              exit 1
            fi
          fi

      - name: Write signing config
        if: steps.signing.outputs.ready == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p android/keystore
          echo "$KEYSTORE_BASE64" | base64 -d > android/keystore/weatherdashboard.jks
          {
            echo "storeFile=keystore/weatherdashboard.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/keystore.properties
          chmod 600 android/keystore/weatherdashboard.jks android/keystore.properties

      - name: Build release APK
        if: steps.signing.outputs.ready == 'true'
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Fail if the app asks for unexpected permissions
        if: steps.signing.outputs.ready == 'true'
        run: |
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          APK=android/app/build/outputs/apk/release/app-release.apk
          PERMS=$("$BUILD_TOOLS/aapt2" dump badging "$APK" \
            | grep "^uses-permission:" | sed "s/uses-permission: name='//;s/'//" | sort)
          echo "$PERMS"
          # INTERNET and the two location permissions are declared in the
          # manifest. DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION is injected by
          # androidx.core: it is signature-level, scoped to this app's own
          # applicationId, grants nothing to any other app, and protects
          # dynamically registered broadcast receivers. It is listed explicitly
          # so that any *additional* permission still fails the build.
          EXPECTED=$(printf '%s\n' \
            android.permission.ACCESS_COARSE_LOCATION \
            android.permission.ACCESS_FINE_LOCATION \
            android.permission.INTERNET \
            com.smokey7428.weatherdashboard.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION | sort)
          if [ "$PERMS" != "$EXPECTED" ]; then
            echo "::error::Permission set changed. Review the diff above."
            exit 1
          fi

      - name: Report permissions and signature
        if: steps.signing.outputs.ready == 'true'
        run: |
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          APK=android/app/build/outputs/apk/release/app-release.apk
          {
            echo "### APK"
            echo '```'
            "$BUILD_TOOLS/aapt2" dump badging "$APK" \
              | grep -E "^package:|^launchable-activity:|^uses-permission:" || true
            echo '```'
            echo "### Signing certificate"
            echo '```'
            "$BUILD_TOOLS/apksigner" verify --print-certs "$APK" \
              | grep -E "Signer #1 certificate (DN|SHA-256)" || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: steps.signing.outputs.ready == 'true'
        with:
          name: weather-dashboard-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Attach APK to release
        if: steps.signing.outputs.ready == 'true' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/*.apk
          body: |
            Weather Dashboard for Android.

            Install it by opening the APK on your phone and allowing
            installation from this source when Android asks. That prompt is
            normal for any app that does not come from an app store.

            Verify what you downloaded: compare the signing certificate
            SHA-256 fingerprint in the build summary with the one published by
            whoever sent you this.
